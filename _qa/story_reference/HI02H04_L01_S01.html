:root{
  --navy:#0B3D8C; --navy-dk:#072A6A;
  --band-bg:#DCEEFF; --band-edge:#B7DCFB;
  --cream:#FFF6D8; --cream-edge:#F0E5C8;
  --pic-bg:#F4F8FE; --pic-border:#7DA8DA; --card-border:#DADADA;
  /* FLN Assets Kit design tokens */
  --selected:#386AF6; --selected-bg:#E6F0FF;
  --correct:#00B132; --correct-bg:#CCF8D8;
  --wrong:#F93544; --wrong-bg:#FFEBEC;
  --drag-bg:#D9ECFF; --drag-border:#8BBFFF;
  --font-hi:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;
  --band-top:24px; --band-left:76.5px; --band-w:1214.59px; --band-h:78px;
  --band-pad-l:75px; --band-pad-r:10px; --band-radius:999px; --band-border:3px;
  --band-font:30px;
  --mascot-left:14px; --mascot-top:2px; --mascot-size:134px;
  --chip-size:73px; --chip-right:-29.5px; --chip-bottom:-15.5px;   /* [MIC-CHIP-110] 66 -> 73px (72.6 rounded), same centre */
  --hint-top:32px; --hint-right:128px; --hint-size:60px;
  --page-y-gap:1rem;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#F6FBFF;font-family:var(--font-hi);color:var(--navy);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;padding:max(var(--page-y-gap), env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(var(--page-y-gap), env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));}
/* in-lesson: white letterbox = invisible against the white stage.
   START SCREEN: the sunburst art covers the WHOLE viewport via <body>, and the
   scaled stage + gate go transparent so that ONE sunburst shows through
   seamlessly (fullscreen, no solid-colour letterbox — the S03 landing look).
   The in-lesson mascot header is hidden on the landing (the gate used to cover it). */
body.is-start{background:#7FC8F4 url("assets/UI/start_bg.webp") center/cover no-repeat;}
body.is-start .stage{background:transparent;}
body.is-start .start-gate{background:transparent;}
body.is-start .header-row{visibility:hidden;}
.stage-wrap{width:calc(1333px*var(--scale,1));height:calc(750px*var(--scale,1));position:relative;}
.stage{width:1333px;height:750px;position:absolute;top:0;left:0;transform-origin:top left;transform:scale(var(--scale,1));background:#F6FBFF;overflow:hidden;display:flex;flex-direction:column;}
.stage-inner{flex:1;min-height:0;display:flex;flex-direction:column;transition:filter .25s ease;}
.stage.blurred .stage-inner{filter:blur(5px);}

/* ===== HEADER (constant chrome) ===== */
.header-row{position:relative;flex-shrink:0;height:140px;}
.prompt-band{position:absolute;top:var(--band-top);left:var(--band-left);width:var(--band-w);height:var(--band-h);background:var(--band-bg);border:var(--band-border) solid var(--band-edge);border-radius:var(--band-radius);display:flex;align-items:center;justify-content:flex-start;padding:0 var(--band-pad-r) 0 var(--band-pad-l);z-index:1;box-shadow:0 3px 0 rgba(11,61,140,.05);transition:background .2s ease,border-color .2s ease;}
.prompt-band .prompt-text{font-weight:800;font-size:var(--band-font);color:var(--navy);letter-spacing:.2px;line-height:1.15;text-align:left;}
/* Persistent reacting mascot: a free-standing Swiftee (no circle frame) that swaps
   expression per user action — talking / celebrate / tryagain / hint. */
.mascot-wrap{position:absolute;left:var(--mascot-left);top:var(--mascot-top);width:var(--mascot-size);height:var(--mascot-size);z-index:3;cursor:pointer;}
.mascot-circle{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;}
.mascot-circle .mascot-img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 8px rgba(0,47,118,.22));transition:transform .18s ease;}
.mascot-circle .mascot-img.fallback{display:none;}
/* a quick bounce whenever the expression changes, to draw the eye (no mask now) */
.mascot-wrap.react .mascot-img{animation:mascotReact .55s cubic-bezier(.34,1.4,.6,1);}
@keyframes mascotReact{0%{transform:scale(1) rotate(0);}35%{transform:scale(1.16) rotate(-5deg);}68%{transform:scale(1.04) rotate(3deg);}100%{transform:scale(1) rotate(0);}}
.mascot-wrap .audio-chip{position:absolute;bottom:var(--chip-bottom);right:var(--chip-right);width:var(--chip-size);height:var(--chip-size);z-index:4;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));transition:transform .12s;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;padding:0;}
.mascot-wrap .audio-chip img{width:100%;height:100%;object-fit:contain;display:block;}
.mascot-wrap .audio-chip:hover{transform:scale(1.06);}
.mascot-wrap .audio-chip:active{transform:scale(.95);}
.mascot-wrap .audio-chip.playing{animation:audioPulse 1s ease-in-out infinite;}
@keyframes audioPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.hint-btn{position:absolute;top:var(--hint-top);right:var(--hint-right);width:var(--hint-size);height:var(--hint-size);background:radial-gradient(circle at 50% 36%,#4E93FF,#2A6CF0);border:none;border-radius:50%;cursor:pointer;transition:transform .15s,opacity .25s,background .2s,box-shadow .2s;z-index:5;visibility:hidden;opacity:0;display:flex;align-items:center;justify-content:center;padding:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));}
.hint-btn img{width:100%;height:100%;object-fit:contain;}
.hint-btn.hint-lit{background:radial-gradient(circle at 50% 40%,#FFD84D,#FBB400);box-shadow:0 0 18px 5px rgba(251,180,0,.6);}
.hint-btn.show{visibility:visible;opacity:1;animation:hintPop .35s cubic-bezier(.34,1.5,.6,1);}
@keyframes hintPop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.hint-btn:hover{transform:scale(1.05);} .hint-btn:active{transform:scale(.96);}
.hint-btn:disabled{opacity:.4;cursor:not-allowed;}
.prompt-band.fb-correct,.prompt-band.fb-reveal{background:var(--correct-bg);border-color:var(--correct);}
.prompt-band.fb-correct .prompt-text,.prompt-band.fb-reveal .prompt-text{color:#0a7a2e;}
.prompt-band.fb-wrong{background:var(--wrong-bg);border-color:var(--wrong);}
.prompt-band.fb-wrong .prompt-text{color:var(--wrong);}
.prompt-band.fb-hint{background:#FFF3CF;border-color:#FBB400;}
.prompt-band.fb-hint .prompt-text{color:#9A6A00;}

/* ===== SLIDE STAGE (changes per slide) =====
   Activity area keeps a 150px gap on left & right (matches Q-format reference)
   so content sits centred with breathing room, never edge-to-edge. */
.slide-stage{flex:1;min-height:0;overflow:hidden;position:relative;padding:6px 150px 100px;display:flex;align-items:stretch;justify-content:center;}
.slide-host{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;}

/* === INTRO slide === */
/* INTRO parade eases out of the 150px activity gap so the letter tiles can be larger */
.intro-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;margin:0 -100px;}
.intro-letters{display:flex;gap:24px;}
.intro-letter{width:184px;height:184px;border-radius:24px;background:#F1F7FF;border:5px solid #8BBFFF;display:flex;align-items:center;justify-content:center;font-size:104px;line-height:1;font-weight:800;color:var(--navy);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;box-shadow:0 6px 14px rgba(11,61,140,.13);}
.intro-letter:hover{transform:translateY(-4px);box-shadow:0 9px 18px rgba(11,61,140,.18);}
/* tapped (heard) → turns green */
.intro-letter.played{background:#CCF8D8;border-color:#00B132;color:#0a7a2e;}

/* === MEET_LETTER slide === */
.meet-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:80px;}
.meet-letter-box{width:300px;height:340px;border-radius:28px;background:var(--cream);border:4px solid #F0D98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(11,61,140,.12);cursor:pointer;}
.meet-letter-box .glyph{font-size:200px;font-weight:800;color:var(--navy);line-height:1;}
.meet-letter-box .glyph-img{width:200px;height:200px;object-fit:contain;}
.meet-letter-box .label{font-size:30px;font-weight:700;color:var(--navy-dk);}
.meet-arrow{font-size:64px;color:#8BBFFF;opacity:.9;}
.meet-pic-box{width:320px;height:340px;border-radius:28px;background:#F4F8FE;border:4px solid #8BBFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(11,61,140,.14);}
.meet-pic-box .pic-img{width:220px;height:220px;object-fit:contain;}
.meet-pic-box .pic-img.fallback{display:none;}
.meet-pic-box .pic-emoji{font-size:160px;line-height:1;}
.meet-pic-box .pic-label{font-size:36px;font-weight:800;color:var(--navy);}
.meet-pair{display:flex;gap:80px;align-items:center;justify-content:center;}
.meet-pair-item{display:flex;align-items:center;gap:32px;}

/* === TAP / OPTIONS === */
.q-row{display:flex;flex-direction:column;align-items:center;gap:24px;flex:1;min-height:0;}
.q-stimulus{display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;min-height:200px;}
.stimulus-letter{width:200px;height:200px;border-radius:24px;background:var(--cream);border:4px solid var(--cream-edge);display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:800;color:var(--navy);box-shadow:0 6px 0 var(--cream-edge);}
.stimulus-letter img{width:140px;height:140px;object-fit:contain;}
.stimulus-pic{width:240px;height:200px;border-radius:24px;background:var(--pic-bg);border:4px solid var(--pic-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.stimulus-pic .img{width:140px;height:140px;object-fit:contain;}
.stimulus-pic .img.fallback{display:none;}
.stimulus-pic .emoji{font-size:110px;line-height:1;}
.stimulus-pic .lbl{font-size:24px;font-weight:700;color:var(--navy);}

/* cards are compact + centred (not stretched to full height/width) */
.opt-grid{display:grid;gap:20px;flex:1;min-height:0;width:100%;max-width:1200px;align-items:center;align-content:center;justify-content:center;}
.opt-grid.cols-2{grid-template-columns:repeat(2,minmax(0,450px));}
.opt-grid.cols-3{grid-template-columns:repeat(3,minmax(0,360px));}
.opt-grid.cols-4{grid-template-columns:repeat(4,minmax(0,230px));}
/* every option box on a screen uses the SAME soft-blue outline; compact card height */
.opt-cell{background:#fff;border:3px solid #E4EAF3;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;padding:16px;min-height:315px;box-shadow:0 5px 14px rgba(11,61,140,.10);}
.opt-cell:hover{transform:translateY(-3px);border-color:var(--selected);box-shadow:0 8px 20px rgba(56,106,246,.18);}
.opt-cell.selected{background:var(--selected-bg);border-color:var(--selected);box-shadow:0 0 0 4px rgba(56,106,246,.20),0 5px 10px rgba(0,0,0,.10);}
.opt-cell.correct{border-color:var(--correct);box-shadow:0 5px 10px rgba(0,177,50,.15);}  /* FLN ANIMATION KIT: answer-select (recipes 19+20, install step 14) - the green fill was removed */
.opt-cell.opt-guided{border-color:var(--correct);animation:guidedPulse 1.3s ease-in-out infinite;}
@keyframes guidedPulse{0%,100%{box-shadow:0 0 0 3px rgba(0,177,50,.22),0 5px 14px rgba(0,177,50,.14);}50%{box-shadow:0 0 0 8px rgba(0,177,50,.42),0 6px 18px rgba(0,177,50,.28);}}
.opt-cell.wrong{border-color:var(--wrong);background:var(--wrong-bg);box-shadow:0 5px 10px rgba(249,53,68,.15);}
.opt-cell .big-glyph{font-size:96px;font-weight:800;color:var(--navy);line-height:1;}
.opt-cell .pic-img{width:120px;height:120px;object-fit:contain;}
.opt-cell .pic-img.fallback{display:none;}
.opt-cell .pic-emoji{font-size:104px;line-height:1;}
.opt-cell .lbl{font-size:22px;font-weight:700;color:var(--navy);margin-top:4px;}

/* === DRAG / DROP === */
/* drag stage eases out of the 150px gap + single rows so 6 items fit, never clip.
   No width:100% — let it stretch as a flex item so the -90px margins expand it
   symmetrically (with width:100% the negative margins only shift it left). */
.dd-stage{display:flex;flex-direction:column;gap:26px;flex:1;min-height:0;justify-content:center;margin:0 -90px;}
.dd-row{display:flex;gap:22px;justify-content:center;flex-wrap:nowrap;}
.dd-tile{width:104px;height:104px;border-radius:16px;background:var(--cream);border:4px solid var(--cream-edge);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:var(--navy);cursor:grab;touch-action:none;box-shadow:0 5px 0 var(--cream-edge);user-select:none;position:relative;z-index:2;}
.dd-tile.dragging{cursor:grabbing;z-index:50;transform:scale(1.08);box-shadow:0 12px 24px rgba(56,106,246,.30);transition:none;}
.dd-tile.snapped{cursor:default;}
/* Kit drag/drop zone design: dashed border, colored fill */
.dd-zone{width:150px;height:150px;border-radius:17px;background:var(--drag-bg);border:2px dashed var(--drag-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;}
.dd-zone.hover{background:#E6F0FF;border-color:var(--selected);border-width:3px;box-shadow:0 0 0 8px rgba(56,106,246,.12),0 0 16px rgba(56,106,246,.25);}
.dd-zone.filled{border-width:3px;}
.dd-zone.filled.correct{background:var(--correct-bg);border-color:var(--correct);border-style:dashed;}
.dd-zone.filled.wrong{background:var(--wrong-bg);border-color:var(--wrong);border-style:dashed;}
.dd-zone .zone-img{width:90px;height:90px;object-fit:contain;}
.dd-zone .zone-img.fallback{display:none;}
.dd-zone .zone-emoji{font-size:74px;line-height:1;}
.dd-zone .zone-lbl{font-size:18px;font-weight:700;color:var(--navy);}
/* dropped letter = small green corner badge — clear of the picture & neighbours */
.dd-tile.snapped{position:absolute;width:62px;height:62px;font-size:40px;top:-16px;right:-16px;left:auto;transform:none;border-radius:14px;background:#FFF6D8;border:3px solid var(--correct);box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:5;}

/* sequence slots */
.seq-slots{display:flex;gap:20px;justify-content:center;flex-wrap:nowrap;}
.seq-slot{width:104px;height:104px;border-radius:16px;background:var(--pic-bg);border:4px dashed var(--pic-border);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#9FB6DA;position:relative;}
.seq-slot.filled{border-style:solid;background:var(--cream);border-color:var(--cream-edge);color:var(--navy);}
.seq-slot.correct{background:var(--correct-bg);border-color:var(--correct);}
.seq-slot.wrong{background:var(--wrong-bg);border-color:var(--wrong);}
.seq-slot .ordinal{position:absolute;top:-12px;left:-12px;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid #fff;}

/* ===== GENDER skill (पुल्लिंग / स्त्रीलिंग) =====
   Two NEUTRAL, non-gendered category colours (teal + purple) — deliberately NOT
   blue/pink, to avoid boy/girl colour stereotyping. They only distinguish the two
   categories for sorting; the noun pictures carry no colour cue. */
.gender-cats{flex:1;display:flex;align-items:center;justify-content:center;gap:70px;margin:0 -60px;}
.gender-cat{width:360px;min-height:430px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:26px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 22px rgba(11,61,140,.12);}
.gender-cat.masc{background:#E4F6F4;border:5px solid #2BA79B;}
.gender-cat.fem{background:#EFE9FB;border:5px solid #9277DB;}
.gender-cat:hover{transform:translateY(-4px);}
.gender-cat .cat-title{font-size:42px;font-weight:800;color:#12796E;}
.gender-cat.fem .cat-title{color:#5B3FB0;}
.gender-cat .cat-pic{width:196px;height:196px;object-fit:contain;}
.gender-cat .cat-pic.fallback{display:none;}
.gender-cat .cat-emoji{font-size:150px;line-height:1;}
.gender-cat .cat-word{font-size:34px;font-weight:800;color:var(--navy);}
.gender-cat.played{box-shadow:0 0 0 5px rgba(0,177,50,.25),0 10px 22px rgba(11,61,140,.14);}

/* MEET gender: picture box → gender badge */
.meet-gender{flex:1;display:flex;align-items:center;justify-content:center;gap:64px;}
.gender-badge{padding:18px 46px;border-radius:9999px;font-size:46px;font-weight:800;background:#E4F6F4;border:4px solid #2BA79B;color:#12796E;box-shadow:0 6px 0 rgba(18,121,110,.15);}
.gender-badge.fem{background:#EFE9FB;border-color:#9277DB;color:#5B3FB0;box-shadow:0 6px 0 rgba(91,63,176,.15);}

/* gender OPTION label cell (used inside .opt-cell) */
.opt-cell .gender-label{font-size:44px;font-weight:800;color:#12796E;line-height:1.15;}
.opt-cell .gender-label.fem{color:#5B3FB0;}

/* gender-label STIMULUS (pick-the-picture-by-gender) */
.stimulus-gender{padding:20px 52px;border-radius:24px;font-size:52px;font-weight:800;background:#E4F6F4;border:4px solid #2BA79B;color:#12796E;box-shadow:0 6px 0 rgba(18,121,110,.15);}
.stimulus-gender.fem{background:#EFE9FB;border-color:#9277DB;color:#5B3FB0;box-shadow:0 6px 0 rgba(91,63,176,.15);}

/* SORT into two gender bins */
.sort-stage{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;margin:0 -80px;}
.sort-bins{display:flex;gap:44px;justify-content:center;}
.sort-bin{width:330px;min-height:210px;border-radius:22px;border:3px dashed #2BA79B;background:#E4F6F4;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;}
.sort-bin.fem{border-color:#9277DB;background:#EFE9FB;}
.sort-bin .bin-title{font-size:30px;font-weight:800;color:#12796E;}
.sort-bin.fem .bin-title{color:#5B3FB0;}
.sort-bin.hover{box-shadow:0 0 0 7px rgba(56,106,246,.15);}
.sort-bin .bin-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;}
.sort-tray{display:flex;gap:18px;justify-content:center;flex-wrap:nowrap;}
.sort-item{width:116px;height:116px;border-radius:16px;background:#fff;border:3px solid #8BBFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;box-shadow:0 5px 0 rgba(11,61,140,.12);position:relative;z-index:2;}
.sort-item.dragging{cursor:grabbing;z-index:50;box-shadow:0 12px 24px rgba(56,106,246,.30);transition:none;}
.sort-item img{width:72px;height:72px;object-fit:contain;} .sort-item img.fallback{display:none;}
.sort-item .emoji{font-size:58px;line-height:1;} .sort-item .lbl{font-size:16px;font-weight:700;color:var(--navy);}
.sort-item.snapped{width:88px;height:88px;box-shadow:none;cursor:default;}
.sort-item.snapped img{width:52px;height:52px;} .sort-item.snapped .emoji{font-size:44px;} .sort-item.snapped .lbl{font-size:13px;}
.sort-item.snapped .shape-svg{width:52px;height:52px;}

/* SHAPES (maths) — geometry rendered as SVG; mirrors the letter/picture chrome */
.intro-shapes{display:flex;gap:28px;}
/* container outline kept FAINT/light so the child focuses on the geometric shape
   inside — a strong square-ish box border was being mistaken for a shape itself */
.intro-shape{width:184px;height:184px;border-radius:24px;background:#FBFDFF;border:2px solid #E7EEF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;box-shadow:0 4px 10px rgba(11,61,140,.06);}
.intro-shape:hover{transform:translateY(-4px);box-shadow:0 8px 16px rgba(11,61,140,.12);}
.intro-shape.played{background:#F0FBF4;border-color:#BEE9CC;}
/* shape name revealed on tap — sits on TOP of the shape (hear it + see it).
   Height is always reserved so the shape doesn't jump when the name appears. */
.intro-shape .shape-name{height:32px;line-height:32px;text-align:center;font-family:var(--font-hi);font-size:27px;font-weight:800;color:var(--navy-dk);opacity:0;transform:translateY(-5px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;}
.intro-shape.played .shape-name{opacity:1;transform:none;}
.meet-shape-box{width:300px;height:340px;border-radius:28px;background:var(--cream);border:4px solid #F0D98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 22px rgba(11,61,140,.12);}
.meet-shape-box .label{font-size:34px;font-weight:800;color:var(--navy-dk);}
/* same faint/light box as the intro (slide-1) tiles, so the shape stays the focus */
.stimulus-shape{width:220px;height:220px;border-radius:24px;background:#FBFDFF;border:2px solid #E7EEF8;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(11,61,140,.06);}
.opt-cell .shape-svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.10));}
.sort-bin .bin-head{margin-top:-2px;}
.sort-bins.many{gap:20px;} .sort-bins.many .sort-bin{width:250px;min-height:186px;}

/* SHAPE SORT — clean, roomy bins (scoped so the Hindi gender-sort is untouched):
   faint reference shape + label INSIDE a header, a generous drop area, small snapped
   tiles that sit neatly in the box, and a clear gap down to the source tray. */
.shape-sort{gap:34px;}
.shape-sort .sort-bins{gap:26px;align-items:stretch;}
.shape-sort .sort-bins .sort-bin{width:300px;min-height:236px;background:#F7FAFF;border:2px dashed #C3D4EC;border-radius:22px;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 14px 16px;}
.shape-sort .sort-bins.many .sort-bin{width:250px;}
.shape-sort .sort-bin.hover{box-shadow:0 0 0 6px rgba(56,106,246,.15);border-color:#8BBFFF;}
.shape-sort .bin-head-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.shape-sort .bin-ref{display:flex;opacity:.6;}
.shape-sort .bin-title{font-size:26px;font-weight:800;color:var(--navy-dk);}
.shape-sort .bin-items{flex:1;display:flex;flex-wrap:wrap;gap:12px;align-content:center;justify-content:center;min-height:120px;border-radius:14px;background:rgba(255,255,255,.55);}
.shape-sort .sort-item{width:104px;height:104px;border:2px solid #CFE0F6;box-shadow:0 4px 0 rgba(11,61,140,.10);}
.shape-sort .sort-item .shape-svg{width:64px;height:64px;}
.shape-sort .sort-item.snapped{width:68px;height:68px;box-shadow:none;}
.shape-sort .sort-item.snapped .shape-svg{width:44px;height:44px;}
.shape-sort .sort-tray{gap:22px;margin-top:6px;}

/* COUNTING (maths) — tap-to-count OTO, cardinality, meet-number, make-set */
.count-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
.count-row{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:center;max-width:1220px;}
.count-item{position:relative;width:190px;height:190px;border-radius:26px;background:#FBFDFF;border:2px solid #E7EEF8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;box-shadow:0 5px 12px rgba(11,61,140,.07);}
.count-item:hover{transform:translateY(-3px);box-shadow:0 9px 18px rgba(11,61,140,.13);}
.count-item.counted{background:#F0FBF4;border-color:#BEE9CC;}
.count-item .cobj-emoji{font-size:122px;line-height:1;} .count-item .cobj-img{width:146px;height:146px;object-fit:contain;} .count-item .cobj-img.fallback{display:none;}
.count-item .count-badge{position:absolute;top:-16px;right:-16px;min-width:54px;height:54px;padding:0 8px;border-radius:999px;background:#00B132;color:#fff;font-family:var(--font-hi);font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,120,45,.35);opacity:0;transform:scale(.4);transition:opacity .18s,transform .18s;}
.count-item.counted .count-badge{opacity:1;transform:scale(1);}

/* cardinality set (stimulus) — larger, roomier */
/* objects always in a SINGLE row (no wrap → no lopsided 3+1 layouts). Extra top
   padding leaves room for the count-demo number badges to sit INSIDE the box. */
.count-set{display:flex;flex-wrap:nowrap;gap:18px;justify-content:center;align-items:center;max-width:none;padding:54px 32px 26px;border-radius:26px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);}
.count-set .cobj-emoji{font-size:84px;line-height:1;} .count-set .cobj-img{width:96px;height:96px;object-fit:contain;} .count-set .cobj-img.fallback{display:none;}
.count-set.meet-set{max-width:none;padding:26px 32px;}   /* no callouts here → symmetric */
/* ---- COMPARE_SETS (one-to-one matching → ज़्यादा / कम / बराबर) ---- */
.compare-stage{position:relative;display:flex;flex-direction:column;gap:18px;padding:16px 32px 12px;
  border-radius:24px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);
  margin:0 auto;width:max-content;max-width:100%;flex:0 0 auto;}
.cmp-row{display:flex;flex-wrap:nowrap;gap:16px;align-items:center;z-index:2;}
.cmp-row .cobj{position:relative;width:70px;height:70px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:15px;transition:transform .2s ease,filter .2s ease;}
.cmp-row.top .cobj{background:rgba(56,106,246,.06);}
.cmp-row.bot .cobj{background:rgba(0,177,50,.07);}
.cmp-row .cobj-emoji{font-size:52px;line-height:1;}
.cmp-row .cobj-img{width:58px;height:58px;object-fit:contain;} .cmp-row .cobj-img.fallback{display:none;}
.cmp-row .cobj.leftover{filter:drop-shadow(0 0 10px rgba(0,177,50,.9));transform:scale(1.14);}
/* TEACH-by-doing count: the not-yet-counted objects in the active row invite a tap; counted ones settle */
.cmp-row .cobj.tappable{cursor:pointer;}
.cmp-row .cobj.tappable:not(.counted){animation:cmpTapPulse 1.3s ease-in-out infinite;}
.cmp-row .cobj.counting{transform:scale(1.14);filter:drop-shadow(0 0 12px rgba(56,106,246,.75));}
.cmp-row .cobj.counted{background:rgba(56,106,246,.16);}
@keyframes cmpTapPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.cmp-lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible;}
.cmp-line{stroke:#94A9D4;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 12;opacity:0;transition:opacity .3s ease;}
.cmp-line.show{opacity:1;}
.cmp-match-btn{align-self:center;font-family:var(--font-hi);font-size:20px;font-weight:800;color:#0B3D8C;
  background:#EAF1FF;border:3px solid #8BBFFF;border-radius:14px;padding:5px 22px;cursor:pointer;transition:transform .12s;}
.cmp-match-btn:hover{transform:translateY(-2px);} .cmp-match-btn:disabled{opacity:.45;cursor:default;transform:none;}
/* compare answer chips: shorter than the default 210px cells so the stimulus + chips fit one screen */
.opt-cell:has(.cmp-chip-lbl){min-height:150px;}
.opt-cell:has(.cmp-chip-lbl) .pic-img{width:96px;height:96px;}
.opt-cell:has(.cmp-chip-lbl) .cmp-chip-emoji{font-size:66px;}
.opt-cell .cmp-chip-emoji{font-size:92px;line-height:1;}
.opt-cell .cmp-chip-lbl{font-size:24px;font-weight:800;color:var(--navy);margin-top:2px;}
/* MEET_COMPARE — teaching verdict badge (ज़्यादा / कम / बराबर) */
.meet-compare{display:flex;flex-direction:column;align-items:center;gap:26px;flex:1;justify-content:center;}
.cmp-verdict{font-family:var(--font-hi);font-size:46px;font-weight:800;padding:8px 44px;border-radius:999px;opacity:0;transform:scale(.6);transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.5,.5,1);}
.cmp-verdict.show{opacity:1;transform:scale(1);}
.cmp-verdict.more{color:#00842a;background:#E4F7E8;} .cmp-verdict.less{color:#C23B2E;background:#FCE7E4;} .cmp-verdict.same{color:#0B3D8C;background:#E6EEFF;}
/* MAKE_EQUAL — see-saw balance (produce equality) */
.balance-stage{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;justify-content:center;width:100%;}
.balance{position:relative;width:min(640px,94%);height:300px;margin:0 auto;}
.beam-wrap{position:absolute;left:50%;bottom:76px;width:520px;height:0;transform:translateX(-50%) rotate(0deg);transform-origin:50% 50%;transition:transform .45s cubic-bezier(.34,1.4,.5,1);}
.beam{position:absolute;left:0;bottom:-9px;width:100%;height:18px;background:linear-gradient(#A9CBFF,#8BBFFF);border:3px solid #0B3D8C;border-radius:11px;}
.pan{position:absolute;bottom:6px;width:196px;transform:translateX(-50%);}
.pan-left{left:13%;} .pan-right{left:87%;}
.pan-grid{min-height:96px;background:#fff;border:3px solid #A9CBFF;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;box-shadow:0 5px 12px rgba(11,61,140,.1);transition:border-color .3s,box-shadow .3s;}
.balance.level .pan-grid{border-color:var(--correct);box-shadow:0 0 0 5px rgba(0,177,50,.20);}
.pan-grid .cobj{display:inline-flex;align-items:center;justify-content:center;}
.pan-grid .cobj.added{animation:meetBounce .5s ease;}
.pan-grid .cobj-emoji{font-size:44px;line-height:1;} .pan-grid .cobj-img{width:50px;height:50px;object-fit:contain;} .pan-grid .cobj-img.fallback{display:none;}
.pan-right .cobj{cursor:pointer;}
.fulcrum{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:0;height:0;border-left:46px solid transparent;border-right:46px solid transparent;border-bottom:72px solid #F5A623;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));}
.balance-add{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-hi);font-size:24px;font-weight:800;color:#0B3D8C;background:#EAF1FF;border:3px solid #8BBFFF;border-radius:18px;padding:10px 26px;cursor:pointer;transition:transform .12s;z-index:3;}
.balance-add:hover{transform:translateY(-2px);} .balance-add:disabled{opacity:.5;cursor:default;}
.balance-add .cobj-emoji{font-size:40px;line-height:1;} .balance-add .cobj-img{width:44px;height:44px;object-fit:contain;}

/* "toybox" theme: this card opts in (CARD.theme), but the reference look is the plain #F6FBFF stage with white
   cards, so the theme is deliberately INERT here (no gradient re-tint, no cream/gold card re-skin). */
.stage.thm-toybox{ background:#F6FBFF; }

/* ---- Patterns: MEET_PATTERN (teach) + PATTERN_BUILD (extend / fill-the-gap) ---- */
.pattern-stage{display:flex;flex-direction:column;align-items:center;gap:26px;flex:1;justify-content:center;width:100%;}
.pat-unit-lbl{font-family:var(--font-hi);font-size:22px;font-weight:800;color:#9a5b00;}
.pattern-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;padding:18px 24px;
  border-radius:22px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);max-width:100%;}
.pat-cell{width:82px;height:82px;display:inline-flex;align-items:center;justify-content:center;border-radius:16px;background:#fff;transition:box-shadow .2s,background .2s;}
.pat-cell .cobj-emoji{font-size:58px;line-height:1;} .pat-cell .cobj-img{width:68px;height:68px;object-fit:contain;} .pat-cell .cobj-img.fallback{display:none;}
.pat-cell.unit-glow{background:#FFF6DF;box-shadow:0 0 0 3px #F5C24B inset;animation:meetBounce 1s ease;}
.pat-ghost{width:82px;height:82px;border-radius:16px;border:3px dashed #A9CBFF;background:#F3F7FF;display:inline-flex;align-items:center;justify-content:center;}
.pat-ghost .qmark{font-size:42px;font-weight:800;color:#A9CBFF;}
.pat-ghost.active{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);animation:pulseSlot 1.3s ease-in-out infinite;}
.pat-ghost.shake,.pat-tray-item.shake{animation:shake .4s;}
@keyframes pulseSlot{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.pattern-tray{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;}
.pat-tray-item{width:104px;height:104px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;
  background:#fff;border:4px solid #8BBFFF;cursor:pointer;box-shadow:0 5px 12px rgba(11,61,140,.10);transition:transform .12s,border-color .12s;}
.pat-tray-item:hover{transform:translateY(-3px);border-color:var(--selected);}
.pat-tray-item .cobj-emoji{font-size:64px;line-height:1;} .pat-tray-item .cobj-img{width:76px;height:76px;object-fit:contain;} .pat-tray-item .cobj-img.fallback{display:none;}
/* ================= BLOCK TOWN — गिनो और बनाओ (flagship) ================= */
.bt-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;justify-content:flex-start;width:100%;padding-top:2px;}
.bt-board{display:flex;align-items:center;gap:14px;background:linear-gradient(#E9B77C,#D89A54);border:4px solid #8A5A2B;border-radius:16px;padding:4px 18px;box-shadow:0 4px 0 #8A5A2B,0 8px 14px rgba(0,0,0,.14);}
.bt-numeral{font-family:var(--font-hi);font-weight:800;font-size:60px;line-height:1;color:#3a2a12;min-width:50px;text-align:center;}
.bt-board .bt-goalpic{width:66px;height:66px;object-fit:contain;}
.bt-board .bt-goallbl{font-family:var(--font-hi);font-size:22px;font-weight:800;color:#5a3a12;}
.bt-track{display:flex;gap:7px;}
.bt-nt{width:38px;height:38px;border-radius:9px;border:3px solid #C6D2E8;background:#EEF3FB;display:flex;align-items:center;justify-content:center;font-family:var(--font-hi);font-weight:800;font-size:20px;color:#9FB2D4;transition:transform .18s,background .18s,color .18s,border-color .18s;}
.bt-nt.lit{background:#FDC23C;border-color:#E39A18;color:#5a3a12;transform:scale(1.08);}
.bt-yard{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:44px;flex:1;min-height:0;width:100%;max-width:1000px;}
.bt-crane{position:absolute;top:0;left:50%;width:190px;pointer-events:none;z-index:1;animation:btSway 3.4s ease-in-out infinite;transform-origin:80% 10%;}
.bt-crane img{width:100%;display:block;}
@keyframes btSway{0%,100%{transform:translateX(-172px) rotate(-1.4deg);}50%{transform:translateX(-172px) rotate(1.4deg);}}
.bt-plotwrap{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;position:relative;}
.bt-plot{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:52px;padding:5px 10px;border-radius:10px;position:relative;}
.bt-plot.ground{background:linear-gradient(#CDA46A,#B98A4E);border:3px solid #8A5A2B;border-bottom-width:7px;}
.blk{width:96px;height:var(--bh,46px);border-radius:6px;border:3px solid rgba(0,0,0,.26);box-shadow:inset 0 -7px 0 rgba(0,0,0,.13),inset 0 6px 0 rgba(255,255,255,.30);}
.blk.drop{animation:blkDrop .34s cubic-bezier(.3,1.5,.5,1);}
@keyframes blkDrop{0%{transform:translateY(-72px) scaleY(.82);opacity:.35;}70%{transform:translateY(0) scaleY(1.12);}100%{transform:translateY(0) scaleY(1);opacity:1;}}
.blk.wobble{animation:blkWobble .5s ease-in-out;}
@keyframes blkWobble{0%,100%{transform:rotate(0);}25%{transform:rotate(5deg);}75%{transform:rotate(-5deg);}}
.bt-plot.independent .blk{cursor:pointer;}
.bp-slot{width:96px;height:var(--bh,46px);border-radius:6px;border:3px dashed #A9CBFF;background:rgba(140,180,255,.10);}
.bp-slot.next{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);animation:pulseSlot 1.3s ease-in-out infinite;}
.bt-topper{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;width:118px;pointer-events:none;z-index:3;}
.bt-topper img{width:100%;display:block;}
.bt-topper.snap{animation:blkDrop .42s cubic-bezier(.3,1.5,.5,1);}
.bt-topper.rocket-go{animation:rocketGo 1.15s ease-in forwards;}
@keyframes rocketGo{0%{transform:translate(-50%,0);}100%{transform:translate(-50%,-420px) scale(.65);opacity:0;}}
.bt-pile{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:2;}
.bt-pile-blocks{position:relative;width:118px;height:84px;}
.bt-pile-blocks .blk{position:absolute;width:80px;height:42px;}
.bt-pile:hover .bt-pile-lbl{transform:translateY(-2px);}
.bt-pile-lbl{font-family:var(--font-hi);font-size:20px;font-weight:800;color:#0B3D8C;background:#EAF1FF;border:3px solid #8BBFFF;border-radius:14px;padding:6px 18px;transition:transform .12s;}
.bt-friend{width:104px;align-self:flex-end;z-index:2;}
.bt-friend img{width:100%;display:block;}
.bt-friend.hop{animation:btHop .6s ease-in-out 2;}
@keyframes btHop{0%,100%{transform:translateY(0);}40%{transform:translateY(-34px);}}
.bt-friend.peer{animation:btPeer 1.2s ease-in-out infinite;}
@keyframes btPeer{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(-4deg);}}
.bt-serve{font-family:var(--font-hi);font-size:24px;font-weight:800;color:#fff;background:linear-gradient(#37B24D,#2F9E44);border:none;border-radius:18px;padding:9px 38px;cursor:pointer;box-shadow:0 5px 0 #237032,0 9px 14px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;}
.bt-serve:active{transform:translateY(4px);box-shadow:0 2px 0 #237032;}
.bt-serve:disabled{opacity:.45;cursor:default;}
.bt-dust{position:absolute;left:50%;bottom:2px;font-size:26px;pointer-events:none;animation:btDust .5s ease-out forwards;}
@keyframes btDust{0%{opacity:.85;transform:translate(-50%,0) scale(.6);}100%{opacity:0;transform:translate(-50%,-20px) scale(1.35);}}
.bt-skyline{display:flex;align-items:flex-end;justify-content:center;gap:9px;height:40px;padding:3px 10px 0;border-top:4px solid #8A5A2B;width:100%;max-width:880px;}
.bt-bldg{width:42px;border-radius:5px 5px 0 0;background:#CBD6EA;transition:background .4s,box-shadow .5s;}
.bt-bldg.done{background:linear-gradient(#F9B84E,#F2933C);box-shadow:0 -2px 0 #d97b22;}
.bt-bldg.lit{box-shadow:0 0 15px 4px rgba(253,194,60,.95);}
.bt-dial{display:flex;align-items:center;gap:22px;}
.bt-dial-btn{width:76px;height:76px;border-radius:50%;border:4px solid #8BBFFF;background:#EAF1FF;font-size:46px;font-weight:800;color:#0B3D8C;cursor:pointer;line-height:1;box-shadow:0 4px 0 #6f9fe0;transition:transform .1s,box-shadow .1s;}
.bt-dial-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6f9fe0;}
.bt-dial-val{font-family:var(--font-hi);font-weight:800;font-size:92px;min-width:120px;text-align:center;color:#0B3D8C;background:#fff;border:5px solid #8BBFFF;border-radius:20px;padding:2px 10px;line-height:1.05;}
.bt-dial-val.match{color:#2F9E44;border-color:#37B24D;animation:correctPop .5s;}
/* each countable object is wrapped so the hint-demo can highlight it + badge it */
.count-set .cobj{position:relative;display:inline-flex;align-items:center;justify-content:center;transition:transform .2s ease,filter .2s ease;}
.count-set .cobj.counting{transform:scale(1.16);filter:drop-shadow(0 0 12px rgba(56,106,246,.75));}
.count-callout{position:absolute;top:-36px;left:50%;transform:translateX(-50%);min-width:42px;height:42px;padding:0 8px;border-radius:999px;background:#386AF6;color:#fff;border:3px solid #fff;font-family:var(--font-hi);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(56,106,246,.5);animation:calloutPop .22s cubic-bezier(.34,1.5,.6,1);z-index:4;}
@keyframes calloutPop{from{opacity:0;transform:translateX(-50%) scale(.4);}to{opacity:1;transform:translateX(-50%) scale(1);}}

/* MEET number intro: link "1"↔"🍎" — the numeral card glows + bounces, then (0.55s
   later, following the VO "एक … सेब") the object glows + bounces. Lively, kid-friendly. */
.number-meet .meet-number-box{animation:meetGlow 2.2s ease-in-out 1;}
.number-meet .count-set.meet-set{animation:meetGlow 2.2s ease-in-out .55s 1;}
.number-meet .meet-number-box .num-glyph{display:inline-block;animation:meetBounce 1.1s ease-in-out 1;}
.number-meet .count-set.meet-set .cobj-emoji,
.number-meet .count-set.meet-set .cobj-img{display:inline-block;animation:meetBounce 1.1s ease-in-out .55s 1;}
@keyframes meetGlow{0%,100%{box-shadow:0 6px 16px rgba(11,61,140,.08);}50%{box-shadow:0 0 0 6px rgba(56,106,246,.22),0 10px 24px rgba(56,106,246,.30);}}
@keyframes meetBounce{0%,100%{transform:translateY(0) scale(1);}30%{transform:translateY(-15px) scale(1.09);}55%{transform:translateY(0) scale(1);}}

/* numeral option card */
.opt-cell .num-glyph{font-family:var(--font-hi);font-size:104px;font-weight:800;color:var(--navy);line-height:1;}
.opt-cell .num-word{font-size:24px;font-weight:700;color:var(--navy);margin-top:2px;}

/* meet-number box (numeral + word) */
.meet-number-box{width:300px;height:340px;border-radius:28px;background:#fff;border:3px solid #CFE0F6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 16px rgba(11,61,140,.08);}
.meet-number-box .num-glyph{font-family:var(--font-hi);font-size:176px;font-weight:800;color:var(--navy);line-height:1;}
.meet-number-box .num-word{font-size:38px;font-weight:800;color:var(--navy-dk);}

/* make-set (productive counting) */
.makeset-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;width:100%;}
.makeset-target{display:flex;align-items:center;gap:16px;padding:10px 28px;border-radius:20px;background:#EEF5FF;border:2px solid #CFE2FB;}
.makeset-target .ms-label{font-size:28px;font-weight:800;color:var(--navy-dk);}
.makeset-target .num-glyph{font-family:var(--font-hi);font-size:72px;font-weight:800;color:var(--navy);line-height:1;}
.makeset-target .num-word{font-size:30px;font-weight:800;color:var(--navy);}
.makeset-frame{min-width:760px;max-width:1060px;min-height:210px;border-radius:24px;border:3px dashed #9EC2F5;background:#FBFDFF;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;padding:18px;}
.makeset-frame .ms-item{position:relative;width:118px;height:118px;border-radius:16px;background:#fff;border:2px solid #E7EEF8;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 8px rgba(11,61,140,.08);transition:transform .2s ease,filter .2s ease,border-color .2s ease;}
.makeset-frame .ms-item.counting{transform:scale(1.09);border-color:#8BBFFF;filter:drop-shadow(0 0 10px rgba(56,106,246,.6));}
/* × to remove an added item (discoverable); hidden while the count-demo runs */
.makeset-frame .ms-item .ms-del{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:#F93544;color:#fff;font-size:17px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.22);z-index:5;}
.makeset-frame .ms-item.counting .ms-del{display:none;}
.makeset-add.shake{animation:msShake .4s ease;}
@keyframes msShake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.makeset-frame .ms-item .cobj-emoji{font-size:76px;line-height:1;} .makeset-frame .ms-item .cobj-img{width:86px;height:86px;object-fit:contain;} .makeset-frame .ms-item .cobj-img.fallback{display:none;}
.makeset-add{font-family:var(--font-hi);font-weight:800;font-size:26px;padding:14px 34px;border-radius:16px;border:none;background:#386AF6;color:#fff;cursor:pointer;box-shadow:0 5px 0 #274Fc4;}
.makeset-add:active{transform:translateY(2px);box-shadow:0 3px 0 #274Fc4;}

/* MATCH gender pairs — masculine picture tiles (bigger than letter tiles) */
.dd-tile.pic-tile{width:134px;height:134px;background:#fff;border-color:#8BBFFF;flex-direction:column;gap:2px;padding:6px;font-size:16px;}
.dd-tile.pic-tile .zone-img{width:86px;height:86px;object-fit:contain;} .dd-tile.pic-tile .zone-img.fallback{display:none;}
.dd-tile.pic-tile .zone-emoji{font-size:64px;line-height:1;} .dd-tile.pic-tile .zone-lbl{font-size:16px;font-weight:700;color:var(--navy);}
.dd-tile.matched{opacity:.5;border-color:var(--correct);cursor:default;box-shadow:none;}

/* ===== NAV BUTTON — kit visual style (yellow pill) + Hindi label ===== */
.nav-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;font-family:var(--font-hi);font-weight:800;font-size:26px;color:#C2C2C2;background:#EDEDED;border:3px solid #FFFFFF;border-radius:9999px;padding:10px 40px;min-width:190px;height:62px;cursor:not-allowed;transition:transform .15s,background .2s,color .2s,box-shadow .2s,opacity .3s ease,visibility .3s ease;box-shadow:0 4px 0 #D6D6D6;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;pointer-events:none;visibility:hidden;}
.nav-btn.active{background:linear-gradient(180deg,#FFCE2E,#FCBC18);color:var(--navy);box-shadow:0 5px 0 #E69A00,0 8px 16px rgba(252,183,23,.30);cursor:pointer;opacity:1;pointer-events:auto;visibility:visible;}
.nav-btn.active:hover{transform:translateX(-50%) translateY(-2px);} .nav-btn.active:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #E69A00;}
.nav-btn::after{content:"→";font-size:28px;}
/* teacher/dev nav cluster — bottom-left of the stage */
.devnav{position:absolute;left:14px;bottom:12px;z-index:30;display:flex;gap:8px;align-items:center;}
.devnav-btn{font-family:var(--font-hi);font-size:15px;font-weight:700;color:#3A4A63;background:rgba(255,255,255,.85);border:2px solid #C7D3E6;border-radius:12px;padding:6px 13px;cursor:pointer;box-shadow:0 2px 6px rgba(11,42,90,.12);transition:transform .12s ease,background .15s ease;}
.devnav-btn:hover{background:#fff;transform:translateY(-1px);}
.devnav-btn:active{transform:translateY(1px);}
.jump-overlay{position:absolute;inset:0;z-index:120;background:rgba(11,42,90,.45);display:none;align-items:center;justify-content:center;}
.jump-overlay.show{display:flex;}
.jump-panel{background:#fff;border-radius:20px;width:min(760px,86%);max-height:80%;overflow:auto;padding:22px 26px;box-shadow:0 24px 70px rgba(11,42,90,.4);}
.jump-panel h3{font-family:var(--font-hi);font-size:22px;color:var(--navy);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.jump-x{cursor:pointer;font-size:22px;color:#8894a8;border:none;background:none;line-height:1;}
.jump-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.jump-item{text-align:left;font-family:var(--font-hi);border:2px solid #DDE3EE;background:#F6F9FF;border-radius:12px;padding:10px 13px;cursor:pointer;color:var(--navy);line-height:1.35;}
.jump-item:hover{border-color:#386AF6;background:#E9F1FF;transform:translateY(-1px);}
.jump-item.current{border-color:#3FB984;background:#E9FBF1;}
.jump-item b{font-size:16px;display:block;}
.jump-item .ph{color:#6B7B95;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
.jump-item .tp{display:block;color:#3A4A63;font-size:12px;margin-top:2px;}


/* S01_LAYOUT_LOCK_START */
:root{
  --mascot-left:16.5px; --mascot-top:1px; --mascot-size:118px;
  --hint-right:128px;
}
.mascot-circle{width:100%;height:100%;border-radius:50%;background:#9DDBF5;border:4px solid #FFFFFF;box-shadow:0 6px 14px rgba(0,47,118,.20);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px;}
.mascot-circle .mascot-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:none;transition:none;}
.mascot-wrap.react .mascot-img{animation:none;}
.mascot-wrap.feedback-pop .mascot-img{transform:scale(1.08);transition:transform .18s ease;}
.mascot-wrap .audio-chip{background:transparent;border:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));}
.mascot-wrap .audio-chip img{width:100%;height:100%;object-fit:contain;}
.mascot-wrap .audio-chip svg{display:none;}
.start-gate{background:#7FC8F4 url("assets/UI/start_bg.webp") center/cover no-repeat;}
.sg-card{background:url("assets/UI/start_card.webp") center/100% 100% no-repeat;border:none;border-radius:0;box-shadow:none;}
/* S01_LAYOUT_LOCK_END */

/* ===== HINT / FEEDBACK OVERLAY — kit-style card + clean Swiftee ===== */
.hint-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(11,61,140,.28);}
.hint-overlay.show{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hint-box{position:relative;width:760px;max-width:92%;min-height:300px;display:flex;align-items:center;gap:8px;background:#FCF6E3;border:3px solid #F0E5C8;border-radius:36px;box-shadow:0 18px 40px rgba(0,47,118,.28);padding:32px 44px 32px 24px;animation:popUp .3s cubic-bezier(.34,1.4,.6,1);}
@keyframes popUp{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.hint-mascot{width:240px;height:auto;flex-shrink:0;object-fit:contain;align-self:center;filter:drop-shadow(0 6px 10px rgba(0,47,118,.15));}
.hint-body{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:0 24px;}
.hint-text{font-weight:800;font-size:34px;line-height:1.35;color:var(--navy);}
.hint-text.reveal{color:#0a7a2e;font-size:32px;}
.hint-text.correct{color:#0a7a2e;font-size:38px;}
.hint-text.wrong{color:var(--wrong);}
.hint-text.hint{color:var(--navy);}
/* CORRECT/celebration popup: SAME box + SAME mascot size as every other popup
   (mascot keeps the default .hint-mascot 240px) — just centre it (no text here). */
.hint-box.celebrate{justify-content:center;align-items:center;}
.hint-box.celebrate .hint-body{display:none;}
.next-btn{display:none;position:absolute;bottom:24px;right:40px;font-family:var(--font-hi);font-weight:800;font-size:26px;color:var(--navy);background:linear-gradient(180deg,#FFCE2E,#FCBC18);border:3px solid #FFFFFF;border-radius:9999px;padding:10px 34px;cursor:pointer;box-shadow:0 5px 0 #E69A00,0 8px 16px rgba(252,183,23,.30);}
.next-btn.show{display:inline-flex;align-items:center;gap:8px;}
.next-btn::after{content:"→";}
.next-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #E69A00;}

/* ===== BOOT LOADER — solid theme-blue splash shown for ~1.5s ===== */
.loader{position:fixed;inset:0;z-index:200;background:#FFFFFF;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease;}
.loader.hide{opacity:0;pointer-events:none;}
.loader-gif{width:220px;height:auto;max-width:60%;object-fit:contain;}

/* ===== TAP-TO-START GATE — uses provided title-screen art ===== */
.start-gate{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#7FC8F4 url("assets/UI/start_bg.webp") center/cover no-repeat;cursor:pointer;}
.start-gate.hidden{display:none;}
/* inner white tile is the provided image (border + faint rays baked in) */
.sg-card{position:relative;width:1114px;height:456px;background:url("assets/UI/start_card.webp") center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.sg-mascot{position:absolute;left:-24px;bottom:-12px;width:190px;height:auto;z-index:3;object-fit:contain;}
@keyframes sgFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
/* title block in the upper area, clear of the start-button image below */
.sg-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:760px;text-align:center;margin-bottom:150px;}
.sg-title{font-weight:800;font-size:60px;color:var(--navy);line-height:1.1;}
.sg-sub{font-weight:700;font-size:28px;color:var(--navy-dk);opacity:.9;}
/* start button — CSS pill (kit yellow). Starts DISABLED + dull until the landing
   VO finishes, then it lights up and the separate hand-nudge points at it. */
.sg-btn{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:4;
  font-family:var(--font-hi);font-weight:800;font-size:40px;color:var(--navy);
  background:linear-gradient(180deg,#FFCE2E,#FCBC18);border:4px solid #FFFFFF;border-radius:9999px;
  padding:14px 58px;cursor:pointer;box-shadow:0 6px 0 #E69A00,0 10px 20px rgba(252,183,23,.30);
  transition:transform .12s,box-shadow .15s,opacity .25s,filter .25s;}
.sg-btn.ready{opacity:1;filter:none;animation:sgBtnPulse 1.4s ease-in-out infinite;}
.sg-btn:not(.locked):active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #E69A00;}
.sg-btn.locked{cursor:default;opacity:.5;filter:saturate(.4);box-shadow:0 5px 0 #CFCFCF;}
@keyframes sgBtnPulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.04);}}
/* separate tapping hand — hidden until the VO ends, then points at the start button */
.sg-hand{position:absolute;left:calc(50% + 8px);bottom:-34px;transform:translateX(-50%);z-index:5;
  width:100px;height:100px;object-fit:contain;pointer-events:none;display:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));animation:nudgeMove 1s ease-in-out infinite;}
.sg-hand.show{display:block;}
/* landing "listen" button — a warm welcome plays on the title screen; tap to replay */
.sg-vo{position:absolute;left:93px;bottom:-19px;z-index:5;width:64px;height:64px;background:none;border:none;padding:0;cursor:pointer;}
.sg-vo img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.sg-vo .sg-vo-emo{font-size:52px;line-height:74px;}
.sg-vo:active{transform:scale(.92);}
@keyframes sgVoPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}

/* ===== NUDGE HAND — kit asset ===== */
.nudge-hand{position:absolute;width:96px;height:96px;z-index:55;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));animation:nudgeMove 1s ease-in-out infinite;display:none;}
.nudge-hand img{width:100%;height:100%;object-fit:contain;}
.nudge-hand.show{display:block;}
@keyframes nudgeMove{0%,100%{transform:translateY(2px);}50%{transform:translateY(-14px);}}

/* ===== END / CELEBRATION ===== */
.end-screen{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,#FFFDF2,#FFF3CF);overflow:hidden;}
.end-screen.show{display:flex;}
.end-title{z-index:3;font-family:var(--font-hi);font-weight:800;font-size:44px;color:#0B3D8C;text-align:center;max-width:78%;line-height:1.25;text-shadow:0 2px 0 rgba(255,255,255,.7);animation:endPop .5s cubic-bezier(.34,1.5,.6,1);}
.end-title:empty{display:none;}
.end-mascot{width:240px;height:auto;object-fit:contain;font-size:200px;line-height:1;filter:drop-shadow(0 12px 22px rgba(0,47,118,.22));animation:endPop .55s cubic-bezier(.34,1.5,.6,1);z-index:2;}
@keyframes endPop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.end-text{font-weight:800;font-size:38px;color:var(--navy);text-align:center;background:var(--cream);border:3px solid var(--cream-edge);padding:18px 52px;border-radius:9999px;box-shadow:0 8px 20px rgba(0,47,118,.14);z-index:2;}
/* "आगे बढ़ें" appears only after the celebration VO finishes */
.end-btn{display:none;z-index:3;font-family:var(--font-hi);font-weight:800;font-size:28px;color:var(--navy);background:linear-gradient(180deg,#FFCE2E,#FCBC18);border:4px solid #FFFFFF;border-radius:9999px;padding:14px 44px;cursor:pointer;box-shadow:0 7px 0 #E69A00,0 11px 20px rgba(252,183,23,.38);}
.end-btn.show{display:inline-flex;align-items:center;animation:hintPop .4s cubic-bezier(.34,1.5,.6,1);}
.end-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #E69A00;}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.confetti i{position:absolute;top:-24px;width:12px;height:18px;border-radius:2px;opacity:.95;animation:confettiFall linear infinite;}
@keyframes confettiFall{0%{transform:translateY(-24px) rotate(0);}100%{transform:translateY(820px) rotate(720deg);}}
/* ---- game-feel: slide entrance + success sparkle particles + correct pop ---- */
.slide-in{animation:slideIn .34s cubic-bezier(.2,.85,.3,1) both;}
@keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(.985);}to{opacity:1;transform:none;}}
.spark{position:absolute;font-size:30px;line-height:1;pointer-events:none;z-index:60;transform:translate(-50%,-50%);animation:sparkFly .9s ease-out forwards;}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}18%{opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(22deg);opacity:0;}}
/* FLN ANIMATION KIT: answer-select (recipes 19+20, install step 14) - `.opt-cell.correct{animation:correctPop ...}` removed: it outranked the kit pop (ckPop) */
@keyframes correctPop{0%{transform:scale(1);}45%{transform:scale(1.08);}100%{transform:scale(1);}}
/* ---- feedback v2 (lead review): tap-to-answer cross+buzz · side confetti · dynamic Swiftie ---- */
.opt-cell.crossed{opacity:.5;pointer-events:none;border-color:var(--wrong);position:relative;}  /* FLN ANIMATION KIT: answer-select (recipes 19+20, install step 14) - red fill and buzzShake removed; the kit wrong beat (wgNo) shakes */
/* FLN ANIMATION KIT: answer-select (recipes 19+20, install step 14) - the 110px cross (`.opt-cell.crossed::after`) was removed: no cross */
@keyframes buzzShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.conf-shot{position:absolute;width:11px;height:15px;border-radius:2px;z-index:70;pointer-events:none;animation:confShot 1.1s cubic-bezier(.15,.6,.4,1) forwards;}
@keyframes confShot{0%{transform:translate(0,0) rotate(0);opacity:1;}80%{opacity:1;}100%{transform:translate(var(--tx),var(--ty)) rotate(560deg);opacity:0;}}

@keyframes swPop{0%{transform:scale(1);}40%{transform:scale(1.13) rotate(-3deg);}100%{transform:scale(1);}}

/* ===== DEV VALIDATOR BANNER ===== */
.dev-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#1a1a1a;color:#ff7;font-family:monospace;font-size:12px;padding:6px 12px;border-radius:6px;display:none;max-width:80%;}
.dev-banner.show{display:block;}
.dev-banner.ok{color:#7fff7f;}

/* ===== STORY SCENE (picture-story teach beat) =====
   A full-frame scene image with a slow Ken-Burns pan-and-zoom so a pre-reader always has
   something moving to look at while the narrator VO plays. Frame width caps at 980px so
   it fits inside .slide-stage's 150px side padding without touching the buddy or nav pill. */
.story-scene{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;height:100%;min-height:0;flex:1;}
.story-frame{flex:1;min-height:0;aspect-ratio:1584/672;width:auto;max-width:100%;border-radius:28px;overflow:hidden;position:relative;background:#EEF6FF;box-shadow:0 14px 40px rgba(11,42,90,.20),0 3px 10px rgba(11,42,90,.10);border:3px solid #FFF;}
.story-img{width:100%;height:100%;object-fit:cover;display:block;animation:storyKenBurns 20s ease-in-out infinite alternate;transform-origin:center center;}
@keyframes storyKenBurns{
  0%{transform:scale(1) translate(0,0);}
  50%{transform:scale(1.035) translate(-0.8%,-0.5%);}
  100%{transform:scale(1.02) translate(0.8%,0.4%);}
}
.story-fallback{font-size:220px;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.story-caption{font-family:var(--font-hi);font-size:32px;color:var(--navy);font-weight:800;text-align:center;background:#FFFFFF /* [WHITE-BARS] 2026-09-23: pill fill was #FFF3C7 (yellow); fill only - border, size, position unchanged */;padding:10px 28px;border-radius:20px;box-shadow:0 4px 14px rgba(11,42,90,.10);max-width:900px;line-height:1.2;border:3px solid #386AF6 /* [BLUE-STROKE] 2026-09-23: pill stroke was #FCD86B (yellow); colour only - width, size, position unchanged */;}

/* ===== TAP IN STORY SCENE =====
   Uses the same framed, full-bleed picture language as the reference story slides.
   Invisible percentage hotspots keep the activity visual-first; feedback uses the
   shared green/red states, mascot reactions, audio, and celebration effects. */
.tis-scene{display:flex;align-items:flex-start;justify-content:center;width:100%;height:100%;padding-top:2px;}
.tis-frame{position:relative;width:1000px;height:560px;border-radius:28px;overflow:hidden;background:#EEF6FF;box-shadow:0 14px 40px rgba(11,42,90,.20),0 3px 10px rgba(11,42,90,.10);border:3px solid #FFF;}
.tis-img{width:100%;height:100%;object-fit:cover;display:block;}
.tis-hot{position:absolute;border:none;background:transparent;cursor:pointer;border-radius:20px;padding:0;-webkit-tap-highlight-color:transparent;transition:box-shadow .18s,transform .1s;}
.tis-hot:hover{box-shadow:0 0 0 4px rgba(255,206,46,.45);}
.tis-hot:active{transform:scale(.96);}
.tis-hot.hit{box-shadow:0 0 0 6px rgba(0,177,50,.75),0 0 26px rgba(0,177,50,.55);}
.tis-hot.pulse{animation:tisPulse 1.1s ease-in-out infinite;}
@keyframes tisPulse{0%,100%{box-shadow:0 0 0 4px rgba(0,177,50,.32);}50%{box-shadow:0 0 0 9px rgba(0,177,50,.6),0 0 28px rgba(0,177,50,.55);}}
.tis-hot.shake{animation:tisShake .32s;}
@keyframes tisShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* ===== STORY QUESTION (comprehension pick) =====
   A small recall thumb + 🔊 chip acts as the stimulus (top of .q-row); options are 2–3
   picture chips rendered under it. Reuses .opt-cell / .opt-grid tokens from mountTapOptions;
   the tap-to-answer feedback (buzz+✕+lock, confetti+advance) is inherited free. */
.story-q-stim{display:flex;align-items:center;gap:24px;padding:14px 26px;border-radius:24px;background:#F4FAFF;box-shadow:0 4px 14px rgba(11,42,90,.10);border:3px solid #C7E2FF;}
/* thumbnail scaled up ~1.5× so a KG child can actually read the scene reminder */
.story-q-thumb{width:340px;aspect-ratio:1584/672;height:auto;object-fit:cover;border-radius:18px;box-shadow:0 3px 10px rgba(11,42,90,.18);}
.story-q-listen{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-hi);cursor:pointer;padding:10px 18px;}
.story-q-listen .listen-icon{width:48px;height:48px;background:rgba(56,106,246,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.story-q-listen .listen-icon svg{width:28px;height:28px;fill:#386AF6;}
.story-q-listen .listen-lbl{font-size:22px;font-weight:700;color:var(--navy);}
/* staggered option reveal */
.opt-cell.opt-pending{opacity:0.5;transform:scale(0.94) translateY(6px);pointer-events:none;transition:opacity 0.38s ease, transform 0.38s cubic-bezier(.34,1.4,.6,1);}
.opt-cell.opt-reveal{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;transition:opacity 0.38s ease, transform 0.38s cubic-bezier(.34,1.4,.6,1);}
/* correct-tap parity with the ✕ on wrong: a green ✓ badge on the tapped-correct card so a
   colour-blind child can distinguish states, and so correct/wrong feedback feel symmetric. */
.opt-cell.correct{position:relative;}
/* FLN ANIMATION KIT: answer-select (recipes 19+20, install step 14) - the 64px tick badge (`.opt-cell.correct::after`) was removed: no tick, the outline is the mark */
.story-q-opt-img{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto;border-radius:14px;}
.story-q-opt-emoji{font-size:180px;line-height:1;display:block;text-align:center;}
.story-q-opt-label{display:block;font-family:var(--font-hi);font-size:34px;color:var(--navy);font-weight:800;text-align:center;margin-top:6px;line-height:1.1;}
/* subtitle bar */


/* ===== engine modules not used by this lesson (kept so the shared engine stays whole) ===== */
/* CONSERVE_COUNT (S03): the counted items drift to new spots — same objects, same total */
.count-stage.conserve .count-item{transition:transform .8s cubic-bezier(.34,1.2,.5,1);}
.count-stage.conserve .count-item.moved{cursor:default;}
/* DENSE large sets (S04, counts up to 20; auto above 10 or with data.per_row rows-of-N grouping) */
.count-row.dense{gap:14px;}
.count-row.dense .count-item{width:96px;height:96px;border-radius:16px;}
.count-row.dense .count-item .cobj-img{width:70px;height:70px;} .count-row.dense .count-item .cobj-emoji{font-size:56px;}
.count-row.dense .count-item .count-badge{min-width:32px;height:32px;font-size:20px;top:-10px;right:-10px;padding:0 5px;}
.count-set.dense{flex-wrap:wrap;max-width:700px;gap:12px;padding:22px 26px 16px;}
.count-set.dense .cobj-img{width:52px;height:52px;} .count-set.dense .cobj-emoji{font-size:42px;}
/* ===== S02 (SME 20-question spec) count arrangements + themed actions + drag-match ===== */
.count-row.arr-circle{position:relative;width:440px;height:380px;margin:0 auto;flex-wrap:nowrap;}
.count-row.arr-circle .count-item{width:118px;height:118px;}
.count-row.arr-circle .count-item .cobj-img{width:88px;height:88px;} .count-row.arr-circle .count-item .cobj-emoji{font-size:72px;}
.count-row.arr-two_groups{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:nowrap;}
.count-cluster{display:flex;flex-wrap:wrap;gap:14px;max-width:320px;align-items:center;justify-content:center;
  padding:16px;border-radius:22px;background:#FBFDFF;border:2px dashed #E0E8F4;}
.count-row.arr-two_groups .count-item{width:118px;height:118px;border-radius:18px;}
.count-row.arr-two_groups .count-item .cobj-img{width:86px;height:86px;} .count-row.arr-two_groups .count-item .cobj-emoji{font-size:70px;}
.count-plus{font-family:var(--font-hi);font-weight:800;font-size:34px;color:var(--navy);opacity:.75;}
/* themed tap-count (pop / feed / basket) */
.count-stage.act{position:relative;}
.act-target{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;}
.act-monster{font-size:118px;line-height:1;transition:transform .18s;}
.act-monster.chomp{animation:meetBounce .5s ease;}
.act-basket .act-basket-img{width:132px;height:132px;object-fit:contain;} .act-basket .act-basket-emoji{font-size:104px;line-height:1;}
.count-row.act-row{margin-top:124px;gap:16px;flex-wrap:wrap;max-width:1120px;}
.count-item.act-item{width:112px;height:112px;border-radius:18px;}
.count-item.act-item .cobj-img{width:82px;height:82px;} .count-item.act-item .cobj-emoji{font-size:66px;}
.count-item.act-item .count-badge{min-width:34px;height:34px;font-size:22px;top:-10px;right:-10px;}
.count-item.act-go{animation:actGo .5s cubic-bezier(.5,-0.2,.7,1) forwards;pointer-events:none;}
@keyframes actGo{0%{transform:scale(1);opacity:1;}55%{transform:translateY(-120px) scale(.5);opacity:.8;}100%{transform:translateY(-220px) scale(.1);opacity:0;}}
.count-stage.act-pop .count-item.act-go{animation:popGo .45s ease forwards;}
@keyframes popGo{0%{transform:scale(1);opacity:1;}45%{transform:scale(1.3);opacity:1;}100%{transform:scale(.2);opacity:0;}}
/* count-then-drag-a-number-card (num_to_box / obj_to_num) */
.count-stage.dragmatch .count-row.show-set{margin-top:8px;}
.cdm-box{width:150px;height:150px;margin:18px auto 8px;border-radius:22px;border:4px dashed #A9CBFF;background:#F3F7FF;
  display:flex;align-items:center;justify-content:center;}
.cdm-box.hover{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);}
.cdm-box.filled{border-style:solid;border-color:#F5C24B;background:#FFF6DF;}
.cdm-box.wrong{border-color:#E5484D;animation:shake .4s;}
.cdm-box-q{font-family:var(--font-hi);font-weight:800;font-size:70px;color:#A9CBFF;}
.cdm-tray{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.cdm-card{width:104px;height:104px;border-radius:20px;background:#fff;border:4px solid #8BBFFF;cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(11,61,140,.10);}
.cdm-card.dragging{z-index:50;cursor:grabbing;} .cdm-card.snapped{opacity:.3;pointer-events:none;}
.cdm-numrow{display:flex;gap:20px;align-items:center;justify-content:center;margin:18px 0 10px;flex-wrap:wrap;}
.cdm-numzone{width:120px;height:120px;border-radius:20px;background:#fff;border:4px solid #E7EEF8;display:flex;align-items:center;justify-content:center;}
.cdm-numzone.hover{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);}
.cdm-numzone.filled.correct{border-color:#F5C24B;background:#FFF6DF;} .cdm-numzone.wrong{border-color:#E5484D;animation:shake .4s;}
.cdm-objtile{width:120px;height:120px;margin:6px auto 0;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;}
.cdm-objtile .cobj-img{width:104px;height:104px;object-fit:contain;} .cdm-objtile.dragging{z-index:50;} .cdm-objtile.snapped{opacity:.3;}
.cdm-numzone.reveal-glow,.cdm-box.reveal-glow{box-shadow:0 0 0 4px #F5C24B;}
/* ===== S02 counting refinements (SME S01 review deck) ===== */
/* test-phase numeral options: the NUMBER alone, larger (fingers are a tutorial aid only) */
.opt-cell .bignum-glyph{font-family:var(--font-hi);font-weight:800;font-size:104px;line-height:1;color:var(--navy);}
/* scattered count-set (misconception: "total changes when objects move") — jitter via inline transform */
.count-set.scattered{padding:26px 18px;}
.count-set.scattered .cobj{transition:none;}
/* PICK_SET_BY_NUMBER — a big numeral stimulus + object-SET option cards */
.psn-stimulus{display:flex;align-items:center;justify-content:center;min-height:120px;padding:6px 42px;
  border-radius:22px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);}
.psn-num{font-family:var(--font-hi);font-weight:800;font-size:96px;line-height:1;color:var(--navy);}
.psn-cell{display:flex;align-items:center;justify-content:center;}
.psn-set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:250px;}
.psn-img{width:56px;height:56px;object-fit:contain;display:block;}
.psn-emoji{font-size:44px;line-height:1;}
/* landing: TITLE first, image below and smaller (SME) */
.sg-content.title-first #sgHero{order:2;}
.sg-content.title-first .sg-title{order:1;}
.sg-content.title-first .sg-sub{order:3;}
.sg-content.title-first .sg-hand{width:84px;height:84px;}
.sg-content.title-first .sg-hand-num{font-size:30px;}
/* ============= NUMBER-SEQUENCE PATH — नंबर क्रम (MTKGA01_L02_S04) ============= */
/* additive: MEET_SEQUENCE (teach hop) · SEQUENCE_COMPLETE (fill the gap) · SEQUENCE_NEXT (pick). */
.seq-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:16px;flex:1;}
.seq-path{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  border-radius:22px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);padding:18px 22px;max-width:100%;}
.seq-cell{position:relative;width:90px;height:90px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:18px;background:#fff;box-shadow:0 3px 0 #E6DFCF,0 6px 14px rgba(0,0,0,.08);
  font-family:var(--font-hi);font-weight:800;font-size:52px;line-height:1;color:var(--navy);transition:box-shadow .2s,background .2s;}
.seq-cell.filled{background:#FFF6DF;}
.seq-cell.lit{background:#FFF6DF;box-shadow:0 0 0 3px #F5C24B inset,0 3px 0 #E6DFCF;}
.seq-cell.unit-glow{background:#FFF6DF;box-shadow:0 0 0 3px #F5C24B inset;animation:meetBounce 1s ease;}
.seq-cell.reveal-glow{background:#FFF6DF;box-shadow:0 0 0 4px #F5C24B inset;}
.seq-connector{width:24px;height:8px;border-radius:4px;background:#D8E4F7;flex:0 0 auto;}
.seq-ghost{border:3px dashed #A9CBFF;background:#F3F7FF;box-shadow:none;}
.seq-ghost .seq-q{font-size:44px;font-weight:800;color:#A9CBFF;}
.seq-ghost.active{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);animation:pulseSlot 1.3s ease-in-out infinite;}
.seq-cell.shake,.seq-tile.shake{animation:shake .4s;}
.seq-token{position:absolute;top:-48px;left:50%;transform:translateX(-50%);font-size:42px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));}
.seq-tray{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;}
.seq-tile{width:104px;height:104px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;
  background:#fff;border:4px solid #8BBFFF;cursor:pointer;box-shadow:0 5px 12px rgba(11,61,140,.10);transition:transform .12s,border-color .12s;
  font-family:var(--font-hi);font-weight:800;font-size:58px;line-height:1;color:var(--navy);}
.seq-tile:hover{transform:translateY(-3px);border-color:var(--selected);}
.seq-tile.used{opacity:.28;pointer-events:none;}
.opt-cell .seq-optnum{font-family:var(--font-hi);font-weight:800;font-size:70px;line-height:1;color:var(--navy);}
/* ============= ORDERING / SERIATION — क्रम में लगाओ (MTKGA02_L02_S02) ============= */
/* additive: MEET_ORDER (teach) · ORDER_BY_ATTR (order small→big) · PICK_EXTREME (tap the most). */
.ord-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:14px;flex:1;}
.ord-arrow{display:flex;align-items:center;gap:14px;font-family:var(--font-hi);font-weight:800;font-size:26px;color:var(--navy);opacity:.8;}
.ord-arrowline{width:460px;height:8px;border-radius:5px;background:linear-gradient(90deg,#CFE0FA,#5C9BEE);position:relative;}
.ord-arrowline::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);border-left:14px solid #5C9BEE;border-top:9px solid transparent;border-bottom:9px solid transparent;}
.ord-strip{display:flex;align-items:flex-end;justify-content:center;gap:20px;min-height:200px;
  border-radius:22px;background:#FBFDFF;border:2px solid #E7EEF8;box-shadow:0 5px 12px rgba(11,61,140,.07);padding:16px 24px;}
.ord-slot{width:158px;min-height:176px;display:flex;align-items:flex-end;justify-content:center;border-radius:18px;border:3px dashed #A9CBFF;background:#F3F7FF;position:relative;padding-bottom:8px;}
.ord-slot .ord-slotnum{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--font-hi);font-weight:800;color:#A9CBFF;font-size:24px;}
.ord-slot.active{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);animation:pulseSlot 1.3s ease-in-out infinite;}
.ord-slot.filled{border-style:solid;border-color:#F5C24B;background:#FFF6DF;}
.ord-tray{display:flex;align-items:flex-end;justify-content:center;gap:28px;min-height:170px;flex-wrap:wrap;}
.ord-item{cursor:pointer;transition:transform .12s;display:flex;align-items:flex-end;justify-content:center;}
.ord-item:hover{transform:translateY(-4px);}
.ord-item.used{opacity:.22;pointer-events:none;}
.ord-item.active{filter:drop-shadow(0 0 10px rgba(56,106,246,.5));}
.ord-item.shake,.ord-pick.shake{animation:shake .4s;}
.ord-item.reveal-glow,.ord-pick.reveal-glow{filter:drop-shadow(0 0 12px #F5C24B);}
.ord-obj-img{object-fit:contain;display:block;}
.ord-obj-emoji{line-height:1;display:inline-block;}
.ord-bar{border-radius:12px;height:46px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.12);}
.ord-pick{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;}
.ord-pick .lbl{font-family:var(--font-hi);font-weight:700;font-size:22px;color:var(--navy);}
.ord-hint-icon{font-size:54px;line-height:1;}
/* balance-scale weighing (ORDER_BY_WEIGHT — weight seriation via evidence, not looks) */
/* weight variant runs compact so scale + strip + tray all fit the 1333×750 stage */
.ord-stage.ord-weight{gap:14px;}
.ord-weight .ord-strip{min-height:158px;padding:12px 20px;}
.ord-weight .ord-slot{min-height:132px;}
.ord-weight .ord-tray{min-height:120px;gap:22px;}
.owt-scale{position:relative;width:290px;height:120px;margin:0 auto;}
.owt-beamwrap{position:absolute;left:50%;top:20px;width:250px;margin-left:-125px;transform-origin:125px 5px;
  transform:rotate(0deg);transition:transform .55s cubic-bezier(.34,1.3,.5,1);}
.owt-beam{position:absolute;left:0;top:0;width:250px;height:10px;border-radius:5px;
  background:linear-gradient(#C79457,#A5722F);box-shadow:0 2px 0 #7c5220;}
.owt-arm{position:absolute;top:5px;width:2px;height:24px;background:#8A5A2B;}
.owt-arm.l{left:28px} .owt-arm.r{right:28px}
.owt-pan{position:absolute;top:26px;width:86px;height:20px;border-radius:0 0 44px 44px;
  background:linear-gradient(#EBD7AE,#D9BE86);border:3px solid #A5722F;border-top:none;}
.owt-pan.l{left:-16px} .owt-pan.r{right:-16px}
.owt-load{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;}
.owt-post{position:absolute;left:50%;top:22px;width:12px;height:70px;margin-left:-6px;background:linear-gradient(#8A5A2B,#6d4720);border-radius:6px;}
.owt-foot{position:absolute;left:50%;bottom:2px;width:126px;height:13px;margin-left:-63px;background:#6d4720;border-radius:7px;}
.owt-cap{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#A5722F;box-shadow:0 2px 0 #6d4720;}
.owt-pan{cursor:pointer;}
.owt-load .ord-obj-img,.owt-load .ord-obj-emoji{transition:filter .2s;}
.owt-load.lighter{animation:pulseSlot 1.1s ease-in-out infinite;}
.owt-load.lighter .ord-obj-img,.owt-load.lighter .ord-obj-emoji{filter:drop-shadow(0 0 9px #4EBE6A);}
/* ================= BLOCK TOWN — गिनो और बनाओ (flagship) ================= */
.bt-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;justify-content:flex-start;width:100%;padding-top:2px;}
.bt-board{display:flex;align-items:center;gap:14px;background:linear-gradient(#E9B77C,#D89A54);border:4px solid #8A5A2B;border-radius:16px;padding:4px 18px;box-shadow:0 4px 0 #8A5A2B,0 8px 14px rgba(0,0,0,.14);}
.bt-numeral{font-family:var(--font-hi);font-weight:800;font-size:60px;line-height:1;color:#3a2a12;min-width:50px;text-align:center;}
.bt-board .bt-goalpic{width:66px;height:66px;object-fit:contain;}
.bt-board .bt-goallbl{font-family:var(--font-hi);font-size:22px;font-weight:800;color:#5a3a12;}
.bt-track{display:flex;gap:7px;}
.bt-nt{width:38px;height:38px;border-radius:9px;border:3px solid #C6D2E8;background:#EEF3FB;display:flex;align-items:center;justify-content:center;font-family:var(--font-hi);font-weight:800;font-size:20px;color:#9FB2D4;transition:transform .18s,background .18s,color .18s,border-color .18s;}
.bt-nt.lit{background:#FDC23C;border-color:#E39A18;color:#5a3a12;transform:scale(1.08);}
.bt-yard{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:44px;flex:1;min-height:0;width:100%;max-width:1000px;}
.bt-crane{position:absolute;top:0;left:50%;width:190px;pointer-events:none;z-index:1;animation:btSway 3.4s ease-in-out infinite;transform-origin:80% 10%;}
.bt-crane img{width:100%;display:block;}
@keyframes btSway{0%,100%{transform:translateX(-172px) rotate(-1.4deg);}50%{transform:translateX(-172px) rotate(1.4deg);}}
.bt-plotwrap{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;position:relative;}
.bt-plot{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:52px;padding:5px 10px;border-radius:10px;position:relative;}
.bt-plot.ground{background:linear-gradient(#CDA46A,#B98A4E);border:3px solid #8A5A2B;border-bottom-width:7px;}
.blk{width:96px;height:var(--bh,46px);border-radius:6px;border:3px solid rgba(0,0,0,.26);box-shadow:inset 0 -7px 0 rgba(0,0,0,.13),inset 0 6px 0 rgba(255,255,255,.30);}
.blk.drop{animation:blkDrop .34s cubic-bezier(.3,1.5,.5,1);}
@keyframes blkDrop{0%{transform:translateY(-72px) scaleY(.82);opacity:.35;}70%{transform:translateY(0) scaleY(1.12);}100%{transform:translateY(0) scaleY(1);opacity:1;}}
.blk.wobble{animation:blkWobble .5s ease-in-out;}
@keyframes blkWobble{0%,100%{transform:rotate(0);}25%{transform:rotate(5deg);}75%{transform:rotate(-5deg);}}
.bt-plot.independent .blk{cursor:pointer;}
.bp-slot{width:96px;height:var(--bh,46px);border-radius:6px;border:3px dashed #A9CBFF;background:rgba(140,180,255,.10);}
.bp-slot.next{border-color:#386AF6;box-shadow:0 0 0 4px rgba(56,106,246,.18);animation:pulseSlot 1.3s ease-in-out infinite;}
.bt-topper{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;width:118px;pointer-events:none;z-index:3;}
.bt-topper img{width:100%;display:block;}
.bt-topper.snap{animation:blkDrop .42s cubic-bezier(.3,1.5,.5,1);}
.bt-topper.rocket-go{animation:rocketGo 1.15s ease-in forwards;}
@keyframes rocketGo{0%{transform:translate(-50%,0);}100%{transform:translate(-50%,-420px) scale(.65);opacity:0;}}
.bt-pile{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:2;}
.bt-pile-blocks{position:relative;width:118px;height:84px;}
.bt-pile-blocks .blk{position:absolute;width:80px;height:42px;}
.bt-pile:hover .bt-pile-lbl{transform:translateY(-2px);}
.bt-pile-lbl{font-family:var(--font-hi);font-size:20px;font-weight:800;color:#0B3D8C;background:#EAF1FF;border:3px solid #8BBFFF;border-radius:14px;padding:6px 18px;transition:transform .12s;}
.bt-friend{width:104px;align-self:flex-end;z-index:2;}
.bt-friend img{width:100%;display:block;}
.bt-friend.hop{animation:btHop .6s ease-in-out 2;}
@keyframes btHop{0%,100%{transform:translateY(0);}40%{transform:translateY(-34px);}}
.bt-friend.peer{animation:btPeer 1.2s ease-in-out infinite;}
@keyframes btPeer{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(-4deg);}}
